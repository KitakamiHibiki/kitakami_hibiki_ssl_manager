name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            ext: ""
            goos: linux
          - os: windows-latest
            arch: amd64
            ext: ".exe"
            goos: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd web
          npm ci --silent
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o ssl-manager${{ matrix.ext }} ./cmd/server

      - name: Package
        run: |
          mkdir -p release/kitakami_hibiki_ssl_manager/web
          cp ssl-manager${{ matrix.ext }} release/kitakami_hibiki_ssl_manager/
          cp config.yaml release/kitakami_hibiki_ssl_manager/
          cp -r web/dist release/kitakami_hibiki_ssl_manager/web/
          cd release
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a ../ssl-manager-${{ matrix.goos }}-${{ matrix.arch }}.zip kitakami_hibiki_ssl_manager
          else
            tar czf ../ssl-manager-${{ matrix.goos }}-${{ matrix.arch }}.tar.gz kitakami_hibiki_ssl_manager
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssl-manager-${{ matrix.goos }}-${{ matrix.arch }}
          path: ssl-manager-${{ matrix.goos }}-${{ matrix.arch }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'ssl-manager-*'
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
